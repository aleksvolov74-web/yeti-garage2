name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04

    container:
      image: barichello/godot-ci:4.7.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Godot
        shell: bash
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config

          if [ -d /root/.config/godot ]; then
            rm -rf ~/.config/godot
            mv /root/.config/godot ~/.config/godot
          fi

          if [ -d /root/.local/share/godot/export_templates/4.7.2.stable ]; then
            rm -rf ~/.local/share/godot/export_templates/4.7.2.stable
            mv /root/.local/share/godot/export_templates/4.7.2.stable \
               ~/.local/share/godot/export_templates/4.7.2.stable
          fi

          godot --version

      - name: Import project
        shell: bash
        run: |
          godot --headless --path . --import

      - name: Resolve app version
        shell: bash
        run: |
          APP_VERSION="$(sed -n 's/^config\/version="\([0-9][0-9.]*\)"$/\1/p' project.godot | head -n 1)"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported project version: $APP_VERSION"
            exit 1
          fi
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          test "$(grep -Fc "version/name=\"$APP_VERSION\"" export_presets.cfg)" -eq 2
          test "$(grep -c '^version/code=' export_presets.cfg)" -eq 2
          test "$(grep '^version/code=' export_presets.cfg | sort -u | wc -l)" -eq 1

      - name: Validate 3D catalog and view startup
        shell: bash
        run: |
          godot --headless --path . --script tools/validate_3d_catalog.gd

      - name: Run scene startup smoke check
        shell: bash
        run: |
          runtime_smoke_log=/tmp/yeti-garage-runtime-smoke.log
          godot --headless --path . --quit-after 60 2>&1 | tee "$runtime_smoke_log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$runtime_smoke_log"; then
            echo "Godot scene startup reported a script error."
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          mkdir -p build/android

          godot \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android Quick APK" \
            "build/android/YetiGarage-${APP_VERSION}.apk"

          test -f "build/android/YetiGarage-${APP_VERSION}.apk"
          ls -lh "build/android/YetiGarage-${APP_VERSION}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YetiGarage-${{ env.APP_VERSION }}-APK
          path: build/android/YetiGarage-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
